# Installers and releases. `npm run dist` builds for this machine; the Release workflow
# (.github/workflows/release.yml) builds macOS, Windows and Linux and publishes them to GitHub Releases,
# which is also where Saturn checks for updates (electron-updater).
appId: com.saturn-editor.saturn
productName: Saturn
copyright: Copyright © Lewis Milburn

directories:
  output: dist
  buildResources: resources/build

files:
  - out/**
  - resources/**
  - "!resources/build/**"
  - package.json

# node-pty is a native module: it's rebuilt for Electron and must sit outside the asar archive.
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: true

publish:
  provider: github
  owner: Saturn-Editor
  repo: Saturn
  # The Release workflow creates the draft and publishes it once every platform has uploaded.
  releaseType: draft

mac:
  category: public.app-category.developer-tools
  # Icon Composer file: light, dark, clear and tinted appearances (needs Xcode's actool). electron-builder
  # also derives the .icns that older macOS versions use from it.
  icon: resources/icons/icon.icon
  target:
    - target: dmg
      arch: [arm64, x64]
    # The zip is what auto-update downloads on macOS.
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  # Signing and notarization run when the CSC_LINK / APPLE_* secrets are set (see release.yml);
  # without them the build is unsigned, and macOS auto-update won't install it.

win:
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  # A fixed name without spaces, so the release description can link to it (the Release workflow).
  artifactName: Saturn-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  icon: resources/icons/icon.png
  category: Development
  executableName: saturn
  # Shown by package managers for the .deb and .rpm (they require a maintainer).
  maintainer: Saturn Editor <https://github.com/Saturn-Editor/Saturn>
  # AppImage runs on most distributions; the .deb (Debian, Ubuntu) and .rpm (Fedora) install like
  # other packages. Auto-update works for the AppImage; .deb/.rpm users update by installing the new package.
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]

# Fixed names (Saturn-<version>-x64 / -arm64), so the release description can link to them.
appImage:
  artifactName: Saturn-${version}-${arch}.${ext}
deb:
  artifactName: Saturn-${version}-${arch}.${ext}
rpm:
  artifactName: Saturn-${version}-${arch}.${ext}
